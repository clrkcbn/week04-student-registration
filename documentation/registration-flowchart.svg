<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><style>text{font-family:Arial,sans-serif}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.decision{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.success{fill:#ecfdf5;stroke:#059669;stroke-width:2}.title{font-size:25px;font-weight:bold;fill:#172554}.label{font-size:16px;font-weight:bold;fill:#1e293b}.line{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#a)}.note{font-size:14px;font-weight:bold;fill:#475569}</style></defs>
  <text x="450" y="38" text-anchor="middle" class="title">Student Registration Flowchart</text>
  <rect x="325" y="65" width="250" height="60" rx="30" class="box"/><text x="450" y="101" text-anchor="middle" class="label">Open Registration Page</text><line class="line" x1="450" y1="125" x2="450" y2="163"/>
  <rect x="325" y="165" width="250" height="60" rx="10" class="box"/><text x="450" y="201" text-anchor="middle" class="label">Complete and Submit Form</text><line class="line" x1="450" y1="225" x2="450" y2="267"/>
  <polygon points="450,270 590,350 450,430 310,350" class="decision"/><text x="450" y="346" text-anchor="middle" class="label">Is the data valid?</text><text x="450" y="370" text-anchor="middle" class="note">Laravel validation</text>
  <path class="line" d="M310 350 H175 V455"/><text x="230" y="336" class="note">No</text><rect x="55" y="458" width="240" height="60" rx="10" class="decision"/><text x="175" y="494" text-anchor="middle" class="label">Display Validation Errors</text><path class="line" d="M175 518 V580 H295 V195 H321"/>
  <line class="line" x1="450" y1="430" x2="450" y2="482"/><text x="466" y="462" class="note">Yes</text><rect x="325" y="485" width="250" height="60" rx="10" class="box"/><text x="450" y="521" text-anchor="middle" class="label">Store Profile Picture</text><line class="line" x1="450" y1="545" x2="450" y2="583"/>
  <rect x="325" y="585" width="250" height="60" rx="10" class="box"/><text x="450" y="621" text-anchor="middle" class="label">Save Student to MySQL</text><line class="line" x1="450" y1="645" x2="450" y2="683"/>
  <rect x="325" y="685" width="250" height="60" rx="10" class="success"/><text x="450" y="721" text-anchor="middle" class="label">Show Success Message</text><line class="line" x1="450" y1="745" x2="450" y2="783"/>
  <rect x="325" y="785" width="250" height="55" rx="28" class="success"/><text x="450" y="819" text-anchor="middle" class="label">Display Student Profile</text>
</svg>
